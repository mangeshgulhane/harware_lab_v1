    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      
      /* Wire drawing animation */
      .wire-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw-wire 1s ease-out forwards;
      }
      
      @keyframes draw-wire {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
    <script>
      // Monaco Environment must be defined before loader.js is loaded
      window.MonacoEnvironment = {
        getWorkerUrl: function (workerId, label) {
          const workerScript = `
            self.MonacoEnvironment = {
              baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/'
            };
            importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/base/worker/workerMain.js');
          `;
          const blob = new Blob([workerScript], { type: 'application/javascript' });
          return URL.createObjectURL(blob);
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script>
      require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
    </script>
